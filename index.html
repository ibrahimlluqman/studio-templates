<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#050711">

    <title>i.b2002</title>


    <!-- Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
          rel="stylesheet">


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }


        /* =========================
           BODY
        ========================= */

        body {

            font-family: "Cairo", sans-serif;

            background: #050711;

            color: #ffffff;

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;
        }


        /* =========================
           BACKGROUND GLOW
        ========================= */

        body::before {

            content: "";

            position: absolute;

            inset: -30%;

            background:

                radial-gradient(
                    circle at 50% 45%,
                    rgba(73, 102, 255, 0.20),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 20% 20%,
                    rgba(0, 221, 255, 0.10),
                    transparent 22%
                ),

                radial-gradient(
                    circle at 80% 75%,
                    rgba(139, 92, 246, 0.10),
                    transparent 25%
                );

            filter: blur(35px);

            animation:
                ambient 9s ease-in-out infinite alternate;
        }


        /* =========================
           GRID
        ========================= */

        .grid {

            position: absolute;

            inset: 0;

            opacity: 0.13;

            background-image:

                linear-gradient(
                    rgba(255,255,255,0.07) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.07) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent,
                    black 25%,
                    black 75%,
                    transparent
                );
        }


        /* =========================
           ORBS
        ========================= */

        .orb {

            position: absolute;

            width: 280px;

            height: 280px;

            border-radius: 50%;

            border:
                1px solid
                rgba(116,142,255,0.18);

            animation:
                float 8s ease-in-out infinite;
        }


        .orb.one {

            top: -100px;

            right: -90px;
        }


        .orb.two {

            bottom: -140px;

            left: -100px;

            animation-delay: -3s;
        }


        .orb::after {

            content: "";

            position: absolute;

            inset: 30px;

            border-radius: 50%;

            border:
                1px solid
                rgba(116,142,255,0.10);
        }


        /* =========================
           PARTICLES
        ========================= */

        .dots {

            position: absolute;

            inset: 0;

            pointer-events: none;
        }


        .dot {

            position: absolute;

            width: 3px;

            height: 3px;

            border-radius: 50%;

            background: #9da9ff;

            box-shadow:
                0 0 12px #7786ff;

            opacity: 0.5;

            animation:
                drift linear infinite;
        }


        .d1 {

            top: 18%;

            left: 18%;

            animation-duration: 8s;
        }


        .d2 {

            top: 31%;

            left: 79%;

            animation-duration: 11s;

            animation-delay: -3s;
        }


        .d3 {

            top: 75%;

            left: 72%;

            animation-duration: 9s;

            animation-delay: -5s;
        }


        .d4 {

            top: 67%;

            left: 14%;

            animation-duration: 13s;

            animation-delay: -7s;
        }


        .d5 {

            top: 15%;

            left: 57%;

            animation-duration: 10s;

            animation-delay: -2s;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .content {

            position: relative;

            z-index: 5;

            width: 90%;

            max-width: 1000px;

            text-align: center;
        }


        /* =========================
           BRAND
        ========================= */

        .brand {

            font-family:
                "Space Grotesk",
                sans-serif;

            font-size:
                clamp(20px, 3vw, 30px);

            font-weight: 700;

            letter-spacing: 0.12em;

            color: #ffffff;

            margin-bottom: 30px;

            opacity: 0;

            transform: translateY(-20px);

            animation:
                brandIn
                1s
                0.2s
                cubic-bezier(.2,.8,.2,1)
                forwards;
        }


        .brand span {

            color: #7c8cff;

            animation:
                brandGlow
                2.5s
                ease-in-out
                infinite;
        }


        /* =========================
           LINE
        ========================= */

        .line {

            width: 0;

            height: 1px;

            margin: 0 auto 42px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    #7c8cff,
                    transparent
                );

            animation:
                lineIn
                1.2s
                0.6s
                ease
                forwards;
        }


        /* =========================
           TITLE
        ========================= */

        .title {

            min-height: 1.2em;

            font-size:
                clamp(48px, 9vw, 105px);

            line-height: 1.15;

            font-weight: 700;

            letter-spacing: -0.04em;

            margin-bottom: 22px;

            background:

                linear-gradient(
                    90deg,
                    #ffffff,
                    #c0c7ff,
                    #ffffff
                );

            background-size: 200% auto;

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;

            animation:
                textShine
                5s
                linear
                infinite;

            opacity: 0;

            transform:
                translateY(30px)
                scale(0.96);

            filter: blur(8px);

            transition:

                opacity 0.55s ease,

                transform
                0.55s
                cubic-bezier(.2,.8,.2,1),

                filter
                0.55s ease;
        }


        /* =========================
           TITLE SHOW
        ========================= */

        .title.show {

            opacity: 1;

            transform:
                translateY(0)
                scale(1);

            filter: blur(0);
        }


        /* =========================
           TITLE HIDE
        ========================= */

        .title.hide {

            opacity: 0;

            transform:
                translateY(-30px)
                scale(1.04);

            filter: blur(8px);
        }


        /* =========================
           SUBTITLE
        ========================= */

        .subtitle {

            color: #a6adc4;

            font-size:
                clamp(14px, 2vw, 18px);

            font-weight: 400;

            opacity: 0;

            animation:
                subtitleIn
                1s
                1.2s
                ease
                forwards;
        }


        /* =========================
           LOADER
        ========================= */

        .loader {

            width: 180px;

            height: 3px;

            margin:
                35px auto 0;

            border-radius: 100px;

            background:
                rgba(255,255,255,0.08);

            overflow: hidden;

            opacity: 0;

            animation:
                subtitleIn
                1s
                1.5s
                ease
                forwards;
        }


        .loader span {

            display: block;

            width: 40%;

            height: 100%;

            border-radius: 100px;

            background:

                linear-gradient(
                    90deg,
                    #6475ff,
                    #b9c0ff
                );

            animation:
                loading
                2s
                ease-in-out
                infinite;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes brandIn {

            from {

                opacity: 0;

                transform:
                    translateY(-20px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes subtitleIn {

            from {

                opacity: 0;
            }

            to {

                opacity: 1;
            }
        }


        @keyframes lineIn {

            from {

                width: 0;
            }

            to {

                width: 190px;
            }
        }


        @keyframes brandGlow {

            0%,
            100% {

                opacity: 0.65;
            }

            50% {

                opacity: 1;
            }
        }


        @keyframes textShine {

            0% {

                background-position:
                    200% center;
            }

            100% {

                background-position:
                    -200% center;
            }
        }


        @keyframes loading {

            0% {

                transform:
                    translateX(260%);
            }

            50% {

                transform:
                    translateX(50%);
            }

            100% {

                transform:
                    translateX(-260%);
            }
        }


        @keyframes ambient {

            from {

                transform:
                    scale(1)
                    rotate(0deg);
            }

            to {

                transform:
                    scale(1.08)
                    rotate(4deg);
            }
        }


        @keyframes float {

            0%,
            100% {

                transform:
                    translate(0,0)
                    rotate(0deg);
            }

            50% {

                transform:
                    translate(25px,-20px)
                    rotate(8deg);
            }
        }


        @keyframes drift {

            0%,
            100% {

                transform:
                    translate(0,0);

                opacity: 0.15;
            }

            50% {

                transform:
                    translate(30px,-35px);

                opacity: 0.9;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .content {

                width: 94%;
            }


            .brand {

                margin-bottom: 25px;
            }


            .line {

                margin-bottom: 32px;
            }


            .loader {

                width: 150px;
            }
        }


        /* =========================
           REDUCE MOTION
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;
            }
        }

    </style>

</head>


<body>


    <!-- Background -->

    <div class="grid"></div>


    <!-- Decorative Orbs -->

    <div class="orb one"></div>

    <div class="orb two"></div>


    <!-- Floating Particles -->

    <div class="dots">

        <i class="dot d1"></i>

        <i class="dot d2"></i>

        <i class="dot d3"></i>

        <i class="dot d4"></i>

        <i class="dot d5"></i>

    </div>


    <!-- Main -->

    <main class="content">


        <!-- Logo -->

        <div class="brand">

            <span>i.</span>b2002

        </div>


        <!-- Line -->

        <div class="line"></div>


        <!-- Changing Text -->

        <h1
            class="title"
            id="comingText">

            ل نـێـزیک

        </h1>


        <!-- Description -->

        <p class="subtitle">

            Development is underway | دقوناغا گەشەپێدانێ دایە | قيد التطوير

        </p>


        <!-- Loading -->

        <div class="loader">

            <span></span>

        </div>


    </main>


    <script>

        /* =========================
           MULTI LANGUAGE TEXT
        ========================= */

        const textElement =
            document.getElementById(
                "comingText"
            );


        const languages = [

            "ل نـێـزیک",

            "Coming Soon",

            "قريباً"

        ];


        let currentIndex = 0;


        /* =========================
           FIRST APPEARANCE
        ========================= */

        setTimeout(() => {

            textElement.classList.add(
                "show"
            );

        }, 100);


        /* =========================
           CHANGE TEXT
           EVERY 2 SECONDS
        ========================= */

        setInterval(() => {


            /* Hide current text */

            textElement.classList.remove(
                "show"
            );

            textElement.classList.add(
                "hide"
            );


            /* Wait for animation */

            setTimeout(() => {


                /* Next language */

                currentIndex++;


                if (
                    currentIndex >=
                    languages.length
                ) {

                    currentIndex = 0;

                }


                /* Change text */

                textElement.textContent =
                    languages[currentIndex];


                /* Show new text */

                textElement.classList.remove(
                    "hide"
                );

                textElement.classList.add(
                    "show"
                );


            }, 550);


        }, 2000);

    </script>


</body>

</html>
