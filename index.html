<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#050711">

  <title>1b2002 | ل نێـزیک</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

  <style>

    /* =========================
       RESET
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }


    /* =========================
       BODY
    ========================= */

    body {

      font-family: "Cairo", sans-serif;

      background: #050711;

      color: white;

      display: flex;

      align-items: center;

      justify-content: center;

      position: relative;
    }


    /* =========================
       BACKGROUND LIGHT
    ========================= */

    body::before {

      content: "";

      position: absolute;

      inset: -30%;

      background:

        radial-gradient(
          circle at 50% 45%,
          rgba(73, 102, 255, 0.18),
          transparent 25%
        ),

        radial-gradient(
          circle at 20% 20%,
          rgba(0, 221, 255, 0.10),
          transparent 22%
        ),

        radial-gradient(
          circle at 80% 75%,
          rgba(139, 92, 246, 0.10),
          transparent 25%
        );

      filter: blur(30px);

      animation:
        ambient 9s ease-in-out infinite alternate;
    }


    /* =========================
       GRID
    ========================= */

    .grid {

      position: absolute;

      inset: 0;

      opacity: 0.16;

      background-image:

        linear-gradient(
          rgba(255,255,255,0.06) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(255,255,255,0.06) 1px,
          transparent 1px
        );

      background-size: 55px 55px;

      mask-image:
        linear-gradient(
          to bottom,
          transparent,
          black 25%,
          black 75%,
          transparent
        );
    }


    /* =========================
       DECORATIVE ORBS
    ========================= */

    .orb {

      position: absolute;

      width: 260px;

      height: 260px;

      border: 1px solid rgba(116,142,255,0.18);

      border-radius: 50%;

      animation:
        float 8s ease-in-out infinite;
    }

    .orb.one {

      top: -90px;

      right: -80px;
    }

    .orb.two {

      bottom: -130px;

      left: -90px;

      animation-delay: -3s;
    }

    .orb::after {

      content: "";

      position: absolute;

      inset: 28px;

      border: 1px solid rgba(116,142,255,0.10);

      border-radius: 50%;
    }


    /* =========================
       CONTENT
    ========================= */

    .content {

      position: relative;

      z-index: 2;

      width: min(900px, 90vw);

      text-align: center;

      padding: 40px 20px;
    }


    /* =========================
       LOGO / BRAND
    ========================= */

    .brand {

      font-family: "Space Grotesk", sans-serif;

      font-size:
        clamp(18px, 2.3vw, 28px);

      font-weight: 700;

      letter-spacing: 0.12em;

      color: white;

      margin-bottom: 34px;

      opacity: 0;

      transform: translateY(-18px);

      animation:
        enter 0.9s 0.15s
        cubic-bezier(.2,.8,.2,1)
        forwards;
    }

    .brand span {

      display: inline-block;

      color: #7c8cff;

      animation:
        pulse 2.4s ease-in-out infinite;
    }


    /* =========================
       LINE
    ========================= */

    .line {

      width: 0;

      height: 1px;

      margin: 0 auto 38px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #7c8cff,
          transparent
        );

      animation:
        lineIn 1.1s 0.55s ease forwards;
    }


    /* =========================
       MAIN TITLE
    ========================= */

    .title {

      font-size:
        clamp(48px, 9vw, 105px);

      line-height: 1.08;

      font-weight: 700;

      letter-spacing: -0.045em;

      margin-bottom: 18px;

      background:
        linear-gradient(
          90deg,
          #ffffff 0%,
          #b9c1ff 48%,
          #ffffff 100%
        );

      -webkit-background-clip: text;

      background-clip: text;

      color: transparent;

      background-size: 220% auto;

      opacity: 0;

      transform: translateY(20px);

      animation:

        titleIn 1s 0.8s
        cubic-bezier(.2,.8,.2,1)
        forwards,

        shimmer 5s 2s linear infinite;
    }


    /* =========================
       SUBTITLE
    ========================= */

    .subtitle {

      color: #a6adc4;

      font-size:
        clamp(14px, 2vw, 18px);

      font-weight: 400;

      opacity: 0;

      animation:
        fadeIn 1s 1.25s ease forwards;
    }


    /* =========================
       LOADER
    ========================= */

    .loader {

      width: 170px;

      height: 3px;

      margin: 34px auto 0;

      border-radius: 99px;

      background:
        rgba(255,255,255,0.08);

      overflow: hidden;

      opacity: 0;

      animation:
        fadeIn 1s 1.5s ease forwards;
    }

    .loader span {

      display: block;

      width: 42%;

      height: 100%;

      border-radius: 99px;

      background:
        linear-gradient(
          90deg,
          #6475ff,
          #b3bcff
        );

      animation:
        load 2s ease-in-out infinite;
    }


    /* =========================
       FLOATING DOTS
    ========================= */

    .dots {

      position: absolute;

      inset: 0;

      pointer-events: none;
    }

    .dot {

      position: absolute;

      width: 3px;

      height: 3px;

      background: #9da9ff;

      border-radius: 50%;

      box-shadow:
        0 0 12px #7786ff;

      opacity: 0.6;

      animation:
        drift linear infinite;
    }

    .d1 {

      top: 18%;

      left: 18%;

      animation-duration: 8s;
    }

    .d2 {

      top: 31%;

      left: 79%;

      animation-duration: 11s;

      animation-delay: -3s;
    }

    .d3 {

      top: 75%;

      left: 72%;

      animation-duration: 9s;

      animation-delay: -5s;
    }

    .d4 {

      top: 67%;

      left: 14%;

      animation-duration: 13s;

      animation-delay: -7s;
    }

    .d5 {

      top: 15%;

      left: 57%;

      animation-duration: 10s;

      animation-delay: -2s;
    }


    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes enter {

      to {

        opacity: 1;

        transform: translateY(0);
      }
    }


    @keyframes fadeIn {

      to {

        opacity: 1;
      }
    }


    @keyframes titleIn {

      to {

        opacity: 1;

        transform: translateY(0);
      }
    }


    @keyframes lineIn {

      to {

        width: 180px;
      }
    }


    @keyframes shimmer {

      to {

        background-position:
          -220% center;
      }
    }


    @keyframes load {

      0% {

        transform:
          translateX(250%);
      }

      50% {

        transform:
          translateX(50%);
      }

      100% {

        transform:
          translateX(-250%);
      }
    }


    @keyframes pulse {

      0%,
      100% {

        opacity: 0.65;
      }

      50% {

        opacity: 1;
      }
    }


    @keyframes ambient {

      from {

        transform:
          scale(1)
          rotate(0deg);
      }

      to {

        transform:
          scale(1.08)
          rotate(4deg);
      }
    }


    @keyframes float {

      0%,
      100% {

        transform:
          translate(0,0)
          rotate(0deg);
      }

      50% {

        transform:
          translate(25px,-18px)
          rotate(8deg);
      }
    }


    @keyframes drift {

      0%,
      100% {

        transform:
          translate(0,0);

        opacity: 0.2;
      }

      50% {

        transform:
          translate(30px,-35px);

        opacity: 0.9;
      }
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .content {

        padding:
          30px 16px;
      }

      .brand {

        margin-bottom: 26px;
      }

      .line {

        margin-bottom: 30px;
      }

      .loader {

        margin-top: 28px;
      }
    }


    /* =========================
       REDUCE MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration: 0.01ms !important;

        animation-iteration-count: 1 !important;
      }
    }

  </style>
</head>


<body>


  <!-- Background Grid -->

  <div class="grid"></div>


  <!-- Decorative Circles -->

  <div class="orb one"></div>

  <div class="orb two"></div>


  <!-- Floating Particles -->

  <div class="dots">

    <i class="dot d1"></i>

    <i class="dot d2"></i>

    <i class="dot d3"></i>

    <i class="dot d4"></i>

    <i class="dot d5"></i>

  </div>


  <!-- Main Content -->

  <main class="content">


    <!-- Brand -->

    <div class="brand">

      <span>i.</span>b2002

    </div>


    <!-- Decorative Line -->

    <div class="line"></div>


    <!-- Main Kurdish Title -->

    <h1 class="title">

      Di nêzîk de

    </h1>


    <!-- Description -->

    <p class="subtitle">

      Malper niha tê amadekirin... Hinekî bisekinin.

    </p>


    <!-- Loading Animation -->

    <div class="loader">

      <span></span>

    </div>


  </main>


</body>
</html>
